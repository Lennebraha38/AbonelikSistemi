name: subscription_manager
description: >-
  Tamamen çevrimdışı (offline) çalışan Kişisel Finans ve Abonelik
  Yönetimi uygulaması. SQLite yerel veritabanı, yerel bildirimler ve
  arka plan servisi içerir.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Yerel veritabanı (SQLite)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Ayarların saklanması (para birimi, bildirim tercihleri)
  shared_preferences: ^2.2.3

  # Tarih/para formatlama
  intl: ^0.19.0

  # Yerel bildirimler (Local Notifications)
  flutter_local_notifications: ^17.2.4

  # Arka plan servisi (uygulama kapalıyken bile günlük kontrol)
  flutter_background_service: ^5.0.10

  # Veri dışa aktarma (CSV)
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Veritabanı testleri için masaüstünde SQLite çalıştırma
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
